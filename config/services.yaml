services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Everything in src/ becomes a service, so controllers, subscribers and your own
    # classes are wired up without any further configuration.
    MajesticDev\CommandNetS3\:
        resource: '../src/'
        exclude:
            - '../src/**/DataFixture/'
            - '../src/**/DependencyInjection/'
            - '../src/**/Entity/'
            # Needs the optional Discord plugin, so config/discord.php loads it only when present.
            - '../src/Discord/'
